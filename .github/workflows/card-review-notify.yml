name: Trello Card Review Notify

on:
  repository_dispatch:
    types: [trello-card-review]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Cek checklist & kirim notifikasi kalau siap review
        run: node checklist-review.js "${{ github.event.client_payload.cardId }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REMINDER_LANG: ${{ secrets.REMINDER_LANG }}